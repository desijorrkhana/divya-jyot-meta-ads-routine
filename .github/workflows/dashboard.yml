name: Rebuild dashboard

on:
  schedule:
    # Two chances per hour, 9AM-7PM IST. GitHub fires scheduled runs best-effort
    # (busy minutes like :00/:30 get skipped often — 24 Jul only 1 of 5 fired),
    # so use off-peak minutes and rely on the pair for at-least-once per hour.
    - cron: "12 3-13 * * *"
    - cron: "42 3-13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install google-api-python-client google-auth google-auth-httplib2 openpyxl

      - name: Fetch data
        env:
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          LEADS_SHEET_ID: ${{ secrets.LEADS_SHEET_ID }}
        run: python3 fetch_all.py

      - name: Build dashboard
        run: python3 build_dashboard.py

      - name: Commit
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@github.com"
          git add dashboard.html
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Dashboard auto-update $(TZ=Asia/Kolkata date '+%d %b %Y %H:%M IST')"
          git push

      - name: Deploy to Cloudflare Worker (optional)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx --yes wrangler@4 deploy

      - name: Send dashboard to Telegram (optional)
        if: ${{ env.TG_TOKEN != '' && env.TG_CHAT != '' }}
        run: |
          curl -sf -F chat_id="$TG_CHAT" \
               -F document=@dashboard.html \
               -F caption="Dashboard $(TZ=Asia/Kolkata date '+%d %b %H:%M IST') — open in browser" \
               "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" > /dev/null \
            && echo "Dashboard sent to Telegram" || echo "Telegram send failed (non-fatal)"
